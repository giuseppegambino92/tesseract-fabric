name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable, rustfmt, clippy)
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}

      # the real-checkpoint tests download ~3 GB of open-weight GGUFs from
      # Hugging Face on first use; keep them between runs
      - name: Cache GGUF checkpoints
        uses: actions/cache@v4
        with:
          path: models/*.gguf
          key: gguf-v10-${{ hashFiles('tests/production_v9.rs', 'tests/production_v10.rs') }}
          restore-keys: gguf-v10-

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        # correctness is asserted everywhere; speed thresholds (calibrated on
        # an Apple M3 Max) only print their measurements on shared runners
        env:
          TESSERACT_SKIP_PERF_ASSERTS: "1"
        run: cargo test --release --no-fail-fast

      # informational: the speed measurements behind the thresholds above,
      # printed on this runner's CPU (never fails the job)
      - name: Performance report
        if: always()
        continue-on-error: true
        run: |
          cargo test --release --test math_verification tiled_batch -- --nocapture 2>&1 | grep -E "tiled batch GEMM" || true
          cargo test --release --test production_v10 k_quant -- --nocapture 2>&1 | grep -E "GMAC/s" || true
