<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" role="img" aria-label="Architecture diagram of tesseract-fabric"><rect x="0.5" y="0.5" width="959" height="639" rx="12" fill="#1a1a19" stroke="#3a3a37"/><defs><marker id="ah-text2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c3c2b7"/></marker><marker id="ah-s1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3987e5"/></marker><marker id="ah-s2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d95926"/></marker><marker id="ah-s3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#199e70"/></marker></defs><text x="28.0" y="40.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#f0efec" text-anchor="start">tesseract-fabric at a glance</text><text x="28.0" y="64.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#c3c2b7" text-anchor="start">The solver turns measured nodes and links into one of two layouts; both keep the output exact.</text><rect x="330" y="84" width="300" height="54" rx="10" fill="#232322" stroke="#3a3a37" stroke-width="1.5"/><text x="480.0" y="107.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#f0efec" text-anchor="middle">Clients</text><text x="480.0" y="127.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="middle">OpenAI-compatible HTTP / SSE · chat CLI · dashboard</text><line x1="480" y1="138" x2="480" y2="166" stroke="#c3c2b7" stroke-width="1.6" marker-end="url(#ah-text2)"/><rect x="210" y="168" width="540" height="104" rx="10" fill="#1b2a3d" stroke="#3987e5" stroke-width="1.5"/><text x="480.0" y="192.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#f0efec" text-anchor="middle">Coordinator  ·  tesseract-serve / tesseract-node</text><text x="232.0" y="216.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#f0efec" text-anchor="start">Discovery</text><text x="352.0" y="216.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">UDP 49777 beacons, SipHash-2-4, unicast seeds (LAN opt-in)</text><text x="232.0" y="235.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#f0efec" text-anchor="start">Probe + solver</text><text x="352.0" y="235.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">RTT pings + 64 KB burst → HeteroClusterSolver → assignment</text><text x="232.0" y="254.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#f0efec" text-anchor="start">Scheduling</text><text x="352.0" y="254.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">continuous batching · speculation planner (cost per tree size)</text><line x1="380" y1="272" x2="250" y2="312" stroke="#c3c2b7" stroke-width="1.6" marker-end="url(#ah-text2)"/><text x="306.0" y="284.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#c3c2b7" text-anchor="end">low-latency peers</text><line x1="580" y1="272" x2="710" y2="312" stroke="#c3c2b7" stroke-width="1.6" marker-end="url(#ah-text2)"/><text x="654.0" y="284.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#c3c2b7" text-anchor="start">heterogeneous links</text><rect x="28" y="314" width="440" height="214" rx="10" fill="#232322" stroke="#3a3a37" stroke-width="1.5"/><text x="48.0" y="340.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#f0efec" text-anchor="start">H-TEP group (e.g. 4 × Mac Studio, TB5)</text><text x="48.0" y="360.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">every rank holds a slice of every layer</text><rect x="48" y="376" width="92" height="82" rx="8" fill="#1b2a3d" stroke="#3987e5" stroke-width="1.5"/><text x="94.0" y="398.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#f0efec" text-anchor="middle">rank 0</text><text x="94.0" y="418.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#c3c2b7" text-anchor="middle">attn heads ¼</text><text x="94.0" y="434.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#c3c2b7" text-anchor="middle">experts / FFN ¼</text><text x="94.0" y="450.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#c3c2b7" text-anchor="middle">KV of its heads</text><rect x="150" y="376" width="92" height="82" rx="8" fill="#1b2a3d" stroke="#3987e5" stroke-width="1.5"/><text x="196.0" y="398.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#f0efec" text-anchor="middle">rank 1</text><text x="196.0" y="418.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#c3c2b7" text-anchor="middle">attn heads ¼</text><text x="196.0" y="434.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#c3c2b7" text-anchor="middle">experts / FFN ¼</text><text x="196.0" y="450.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#c3c2b7" text-anchor="middle">KV of its heads</text><rect x="252" y="376" width="92" height="82" rx="8" fill="#1b2a3d" stroke="#3987e5" stroke-width="1.5"/><text x="298.0" y="398.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#f0efec" text-anchor="middle">rank 2</text><text x="298.0" y="418.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#c3c2b7" text-anchor="middle">attn heads ¼</text><text x="298.0" y="434.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#c3c2b7" text-anchor="middle">experts / FFN ¼</text><text x="298.0" y="450.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#c3c2b7" text-anchor="middle">KV of its heads</text><rect x="354" y="376" width="92" height="82" rx="8" fill="#1b2a3d" stroke="#3987e5" stroke-width="1.5"/><text x="400.0" y="398.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#f0efec" text-anchor="middle">rank 3</text><text x="400.0" y="418.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#c3c2b7" text-anchor="middle">attn heads ¼</text><text x="400.0" y="434.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#c3c2b7" text-anchor="middle">experts / FFN ¼</text><text x="400.0" y="450.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#c3c2b7" text-anchor="middle">KV of its heads</text><rect x="48" y="472" width="398" height="34" rx="8" fill="#3987e5"/><text x="247" y="494" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">fixed-point all-reduce → bit-identical to one node</text><text x="48.0" y="520.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#9a9990" text-anchor="start">attention is split only when aligned to quant blocks, else replicated</text><rect x="492" y="314" width="440" height="214" rx="10" fill="#232322" stroke="#3a3a37" stroke-width="1.5"/><text x="512.0" y="340.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#f0efec" text-anchor="start">Pipeline (e.g. Studio + RTX over 2.5GbE)</text><text x="512.0" y="360.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">stages own layer ranges; trees are verified losslessly</text><rect x="512" y="376" width="180" height="92" rx="8" fill="#1b2a3d" stroke="#3987e5" stroke-width="1.5"/><text x="602.0" y="398.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#f0efec" text-anchor="middle">Stage 0 · Mac Studio</text><text x="602.0" y="418.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#c3c2b7" text-anchor="middle">layers 0–12</text><text x="602.0" y="434.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#c3c2b7" text-anchor="middle">cross-step lookahead</text><text x="602.0" y="450.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#c3c2b7" text-anchor="middle">+ draft-ahead drafter</text><rect x="732" y="376" width="180" height="92" rx="8" fill="#1b2a3d" stroke="#3987e5" stroke-width="1.5"/><text x="822.0" y="398.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#f0efec" text-anchor="middle">Stage 1 · RTX 5090</text><text x="822.0" y="418.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#c3c2b7" text-anchor="middle">layers 13–15 + LM head</text><text x="822.0" y="434.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#c3c2b7" text-anchor="middle">verifies token trees</text><text x="822.0" y="450.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#c3c2b7" text-anchor="middle">commits accepted path</text><line x1="692" y1="410" x2="730" y2="410" stroke="#3987e5" stroke-width="1.6" marker-end="url(#ah-s1)"/><line x1="730" y1="438" x2="694" y2="438" stroke="#3987e5" stroke-width="1.6" marker-end="url(#ah-s1)"/><rect x="512" y="480" width="400" height="38" rx="8" fill="#3a2419" stroke="#d95926" stroke-width="1.5" stroke-dasharray="5 4"/><text x="712.0" y="504.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#f0efec" text-anchor="middle">KV page holders (laptop, phone): LSE partials, ≈ 32 KB / step</text><rect x="28" y="548" width="904" height="64" rx="10" fill="#15302a" stroke="#199e70" stroke-width="1.5"/><text x="480.0" y="572.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#f0efec" text-anchor="middle">TesseractWire over real TCP</text><text x="480.0" y="593.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="middle">typed frames with CRC32C · multipath striping · per-link shaping · lossless or compressed activations</text></svg>
